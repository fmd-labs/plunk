name: Fork release

# Builds and publishes this fork's Docker image. See FORK.md (divergence D03 and "Releases").
#
# 1. Run this workflow manually on `next` with the version to release (e.g. 0.15.0-fork.1). It builds
#    the multi-arch image once, publishes it only under a candidate tag written once per run
#    (`sha-<7 characters of the commit>-run.<run id>`), and smoke-tests exactly that image on both
#    architectures. The run summary names the candidate's digest.
# 2. Verify that image end to end.
# 3. Push the annotated tag `v<version>` on the same commit, with the verified digest in its message.
#    The tag run promotes that digest, if a successful candidate run of that version for that commit
#    published it, without rebuilding it. It never replaces an existing release image; one that
#    already points to the digest counts as promoted.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Candidate {0}', inputs.version) ||
  format('Promote {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version this candidate is built for, e.g. 0.15.0-fork.1'
        required: true
        type: string
  push:
    tags:
      - 'v*-fork.*'

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.params.outputs.mode }}
      version: ${{ steps.params.outputs.version }}
      candidate: ${{ steps.params.outputs.candidate }}
    steps:
      - name: Resolve release parameters
        id: params
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/next" ]]; then
              echo "::error::Candidates are built from next only, not from $GITHUB_REF."
              exit 1
            fi
            MODE=candidate
            VERSION="$INPUT_VERSION"
          else
            MODE=promote
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' does not match X.Y.Z-fork.N"
            exit 1
          fi
          {
            echo "mode=$MODE"
            echo "version=$VERSION"
            # Unique per run, so no later run can replace an image that was already smoke-tested.
            if [[ "$MODE" == "candidate" ]]; then
              echo "candidate=sha-${GITHUB_SHA:0:7}-run.$GITHUB_RUN_ID"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE, version: $VERSION, commit: $GITHUB_SHA"

  # Candidate: build natively on each platform (no QEMU emulation), push by digest.
  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.mode == 'candidate'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fork-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Candidate: combine the platform images under the run's candidate tag only.
  merge:
    name: Publish candidate
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/fork

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: publish
        working-directory: /tmp/digests
        env:
          CANDIDATE: ${{ env.IMAGE }}:${{ needs.prepare.outputs.candidate }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A candidate tag is written once: a re-run of this run keeps the candidate it already
          # published, and the smoke test checks that same image again.
          DIGEST="$(REGISTRY_USERNAME="$GITHUB_ACTOR" REGISTRY_PASSWORD="$GH_TOKEN" node "$GITHUB_WORKSPACE/scripts/fork/registry.mjs" digest "$CANDIDATE")"
          if [[ -n "$DIGEST" ]]; then
            echo "$CANDIDATE was already published by this run as $DIGEST; keeping it."
          else
            sources=()
            for digest in *; do
              sources+=("$IMAGE@sha256:$digest")
            done
            docker buildx imagetools create -t "$CANDIDATE" "${sources[@]}"
            DIGEST="$(docker buildx imagetools inspect "$CANDIDATE" --format '{{json .Manifest}}' | jq -r .digest)"
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Candidate $VERSION"
            echo
            echo '```'
            echo "$CANDIDATE"
            echo "$IMAGE@$DIGEST"
            echo "commit $GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Candidate: the image, by digest, must migrate a fresh database and answer /health.
  smoke:
    name: Smoke test candidate (${{ matrix.platform }})
    needs: [prepare, merge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plunk
          POSTGRES_PASSWORD: plunk
          POSTGRES_DB: plunk
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The candidate joins the job's service network and reaches the services by name. Its port 80
      # is published because the image runs nginx as a non-root user inside its own namespace.
      - name: Start candidate
        env:
          NETWORK: ${{ job.services.postgres.network }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          docker run -d --name plunk --network "$NETWORK" -p 8080:80 \
            -e SERVICE=all \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://plunk:plunk@postgres:5432/plunk \
            -e DIRECT_DATABASE_URL=postgresql://plunk:plunk@postgres:5432/plunk \
            -e REDIS_URL=redis://redis:6379 \
            -e JWT_SECRET=smoke-test-only \
            -e API_DOMAIN=api.localhost \
            -e DASHBOARD_DOMAIN=app.localhost \
            -e USE_HTTPS=false \
            -e AWS_SES_REGION=us-east-1 \
            -e AWS_SES_ACCESS_KEY_ID=smoke \
            -e AWS_SES_SECRET_ACCESS_KEY=smoke \
            "$IMAGE@$DIGEST"

      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            if [[ "$(docker inspect -f '{{.State.Running}}' plunk)" != "true" ]]; then
              echo "::error::The candidate container exited"
              docker logs plunk 2>&1 | tail -n 200
              exit 1
            fi
            if curl -fsS --max-time 5 -H 'Host: api.localhost' http://127.0.0.1:8080/health; then
              echo
              echo "Candidate is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Candidate did not become healthy in time"
          docker logs plunk 2>&1 | tail -n 200
          exit 1

      # The runner removes the job's network when the job ends, which fails while a container still uses it.
      - name: Remove candidate
        if: always()
        run: docker rm -f plunk || true

  # Tag: publish the verified candidate under its version, without rebuilding it.
  promote:
    name: Promote candidate
    needs: prepare
    if: needs.prepare.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Finds the candidate run that built and smoke-tested this commit.
      actions: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # The image to promote is the one verified by hand, named by digest in the release tag's message.
      # It must come from a successful manual run of this version for this commit on next: that run
      # built it and smoke-tested exactly that image.
      - name: Find the verified candidate
        id: candidate
        run: |
          set -euo pipefail
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')"
          if [[ "${TAG_OBJECT%% *}" != "tag" ]]; then
            echo "::error::$GITHUB_REF_NAME must be an annotated tag whose message names the verified image digest (see Releases in FORK.md)."
            exit 1
          fi
          MESSAGE="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${TAG_OBJECT#* }" --jq .message)"
          VERIFIED="$( (grep -oE 'sha256:[0-9a-f]{64}' <<< "$MESSAGE" || true) | sort -u)"
          if [[ -z "$VERIFIED" || "$VERIFIED" == *$'\n'* ]]; then
            echo "::error::The message of $GITHUB_REF_NAME must name exactly one image digest (sha256:...): the verified one."
            exit 1
          fi

          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fork-release.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_branch == \"next\" and .display_title == \"Candidate $VERSION\") | .id")"
          # Only the run that published the verified digest can make this succeed: a new run builds a
          # new digest, and the tag cannot be moved.
          RECOVERY="If the run that published $VERIFIED is still running, or failed only its smoke test (Re-run failed jobs), re-run this job once it has succeeded; otherwise release a new version."
          if [[ -z "$RUNS" ]]; then
            echo "::error::No successful candidate run of $VERSION for $GITHUB_SHA. $RECOVERY"
            exit 1
          fi

          readarray -t RUN_IDS <<< "$RUNS"
          for RUN_ID in "${RUN_IDS[@]}"; do
            CANDIDATE="$IMAGE:sha-${GITHUB_SHA:0:7}-run.$RUN_ID"
            DIGEST="$(REGISTRY_USERNAME="$GITHUB_ACTOR" REGISTRY_PASSWORD="$GH_TOKEN" node scripts/fork/registry.mjs digest "$CANDIDATE")"
            if [[ "$DIGEST" == "$VERIFIED" ]]; then
              {
                echo "run-id=$RUN_ID"
                echo "reference=$CANDIDATE"
                echo "digest=$DIGEST"
              } >> "$GITHUB_OUTPUT"
              echo "Candidate $CANDIDATE ($DIGEST) from run $RUN_ID"
              exit 0
            fi
            echo "Run $RUN_ID published ${DIGEST:-no image}, not $VERIFIED"
          done
          echo "::error::No successful candidate run of $VERSION for $GITHUB_SHA published $VERIFIED. $RECOVERY"
          exit 1

      # Checked before anything is created, so this job can simply be re-run once the package is public.
      - name: Check the candidate can be pulled anonymously
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          if ! PUBLIC_DIGEST="$(node scripts/fork/registry.mjs digest "$CANDIDATE")" || [[ "$PUBLIC_DIGEST" != "$DIGEST" ]]; then
            echo "::error::$CANDIDATE cannot be pulled anonymously. Make the package public (package settings, Change visibility), then re-run this job."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          TARGET="$IMAGE:$VERSION"
          lookup() {
            REGISTRY_USERNAME="$GITHUB_ACTOR" REGISTRY_PASSWORD="$GH_TOKEN" node scripts/fork/registry.mjs digest "$1"
          }
          # An authenticated lookup also reads as "absent" for a package the token cannot read; the
          # candidate was found in this same package above, which rules that out.
          EXISTING="$(lookup "$TARGET")"
          if [[ "$EXISTING" == "$DIGEST" ]]; then
            echo "$TARGET already points to $DIGEST; nothing to do."
          elif [[ -n "$EXISTING" ]]; then
            echo "::error::$TARGET already exists as $EXISTING; release images are never replaced."
            exit 1
          else
            # imagetools should push a single source index unchanged; confirm it before the tag exists,
            # as a release tag is never replaced. The dry run prints the index followed by a newline.
            PLANNED="sha256:$(docker buildx imagetools create --dry-run -t "$TARGET" "$IMAGE@$DIGEST" | head -c -1 | sha256sum | cut -d' ' -f1)"
            if [[ "$PLANNED" != "$DIGEST" ]]; then
              echo "::error::Promoting would publish $PLANNED instead of $DIGEST; nothing was changed."
              exit 1
            fi
            docker buildx imagetools create -t "$TARGET" "$IMAGE@$DIGEST"
            PROMOTED="$(lookup "$TARGET")"
            if [[ "$PROMOTED" != "$DIGEST" ]]; then
              echo "::error::$TARGET points to $PROMOTED instead of $DIGEST."
              exit 1
            fi
          fi

      - name: Summary
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          RUN_ID: ${{ steps.candidate.outputs.run-id }}
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo '```'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE@$DIGEST"
            echo "commit $GITHUB_SHA"
            echo "promoted from $CANDIDATE"
            echo "candidate run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
